define contactgroup {
    contactgroup_name       devops_admins
    alias                   DevOps Admins
    members                 nagiosadmin,devops_admin
}
define host {
    use                     linux-server
    host_name               k8s-cluster-node
    alias                   Kubernetes Worker Node
    address                 192.168.49.2
    max_check_attempts      3
    check_period            24x7
    notification_interval   5
    notification_period     24x7
}
define service {
    use                     generic-service
    host_name               k8s-cluster-node
    service_description     K8s_Web_Application
    check_command           check_http!-p 30080 -u /
    max_check_attempts      2
    check_interval          0.5
    retry_interval          0.5
    event_handler_enabled   1
    flap_detection_enabled  0
    event_handler           auto_heal_k8s_service
    notification_interval   1
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          devops_admins,management_escalation
}
