apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-webapp
  namespace: default
  labels:
    app: production-webapp
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-webapp
  template:
    metadata:
      labels:
        app: production-webapp
    spec:
      containers:
      - name: web-container
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: production-webapp-service
  namespace: default
  labels:
    app: production-webapp
spec:
  type: NodePort
  selector:
    app: production-webapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080